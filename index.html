<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sommer 2027</title><meta name="theme-color" content="#0f766e"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{--c:#0f766e;--bg:#f3f7f6;--danger:#c62828}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:#17332f}.wrap{max-width:760px;margin:auto;padding:16px 16px 92px}header{background:linear-gradient(135deg,#0f766e,#34a58f);color:white;padding:24px 16px;border-radius:0 0 26px 26px}header h1{margin:0;font-size:28px}header p{margin:6px 0 0}.card{background:white;border-radius:18px;padding:16px;margin:14px 0;box-shadow:0 4px 16px #00000010}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.tabs button,.btn{border:0;border-radius:12px;padding:12px;font-weight:700}.tabs button{background:#dcece8;color:#164e45}.tabs .on,.btn{background:var(--c);color:white}.hidden{display:none}label{display:block;font-weight:650;margin:12px 0 5px}input,select{width:100%;padding:12px;border:1px solid #cbd9d6;border-radius:11px;font-size:16px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.expense{border-bottom:1px solid #e5eeec;padding:13px 0}.expense:last-child{border:0}.meta{font-size:13px;color:#647773;margin-top:4px}.delete{background:#fff0f0;color:var(--danger);border:1px solid #efb5b5;border-radius:10px;padding:8px 11px;margin-top:9px;font-weight:700}.week{cursor:pointer}.bar{height:9px;background:#e4ecea;border-radius:8px;overflow:hidden;margin-top:7px}.bar i{display:block;height:100%;background:#27a17d}.fab{position:fixed;right:22px;bottom:24px;width:58px;height:58px;border-radius:50%;border:0;background:#ffb300;color:#17332f;font-size:34px;box-shadow:0 6px 20px #0003}.modal{position:fixed;inset:0;background:#0007;display:flex;align-items:flex-end;z-index:20}.modal.hidden{display:none}.sheet{background:white;width:100%;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px}.actions{display:flex;gap:10px;margin-top:16px}.actions>*{flex:1}.secondary{background:#e7efed;color:#234}.status{font-size:13px;color:#506a64;margin-top:8px}.maplink{color:#087f6b;font-weight:650}.total{font-size:26px;font-weight:800}.dangerText{color:#b42318}
</style></head>
<body><header><div class="wrap" style="padding-bottom:12px"><h1>☀️ Sommer 2027</h1><p>Alexandra, Arianny og Thomas · uge 26–31</p></div></header>
<main class="wrap"><div class="tabs"><button id="tbOverview" class="on" onclick="showTab('overview')">Overblik</button><button id="tbBudget" onclick="showTab('budget')">Budget</button><button id="tbExpenses" onclick="showTab('expenses')">Udgifter</button></div>
<section id="overview"><div class="card"><div>Samlet forbrug</div><div class="total" id="spentTotal">0 kr.</div><div id="overallBudget"></div></div><div class="card"><b>Seneste udgifter</b><div id="recent"></div></div></section>
<section id="budget" class="hidden"><div class="card"><b>Budget pr. uge</b><p class="meta">Tryk på en uge for at se forbrug mod budget for hver kategori.</p><div id="weeks"></div></div></section>
<section id="expenses" class="hidden"><div class="card"><b>Alle udgifter</b><div id="allExpenses"></div></div></section></main>
<button class="fab" onclick="openAdd()">+</button>
<div id="addModal" class="modal hidden"><div class="sheet"><h2>Ny udgift</h2><div class="row"><div><label>Beløb</label><input id="amount" type="number" min="0" step="0.01"></div><div><label>Valuta</label><select id="currency"><option value="EUR" selected>EUR €</option><option value="DKK">DKK kr.</option></select></div></div><label>Kategori</label><select id="category"></select><label>Uge</label><select id="week"></select><label>Beskrivelse</label><input id="note" placeholder="Fx diesel"><div class="row"><div><label>By</label><input id="city"></div><div><label>Land</label><input id="country"></div></div><label>Foto af kvittering</label><input id="receipt" type="file" accept="image/*" capture="environment"><button class="btn" style="width:100%;margin-top:12px" onclick="getGPS()">📍 Hent GPS-position</button><div class="status" id="gpsStatus"></div><div class="actions"><button class="btn secondary" onclick="closeAdd()">Annuller</button><button class="btn" onclick="saveExpense()">Gem udgift</button></div></div></div>
<div id="weekModal" class="modal hidden"><div class="sheet"><h2 id="weekTitle"></h2><div id="weekDetails"></div><div class="actions"><button class="btn secondary" onclick="closeWeek()">Luk</button></div></div></div>
<script>
const RATE=7.5,CATS=['Diesel','Vejafgift','Mad/vand/service','Spise ude/restaurant','Entré','Overnatning','Gas','Diverse'];
// Budgetter kan tilpasses. Disse summer er fordelt ens over uge 26-31.
let catBudget={Diesel:12000,Vejafgift:2000,'Mad/vand/service':14996.6890243902,'Spise ude/restaurant':11000,Entré:0,Overnatning:21000,Gas:300,Diverse:6129.66890243903};
const WEEKS=[26,27,28,29,30,31]; let expenses=JSON.parse(localStorage.getItem('summer2027_expenses')||'[]'); let gps=null;
const fmt=n=>new Intl.NumberFormat('da-DK',{style:'currency',currency:'DKK',maximumFractionDigits:0}).format(n);
function showTab(x){['overview','budget','expenses'].forEach(y=>document.getElementById(y).classList.toggle('hidden',y!==x));['Overview','Budget','Expenses'].forEach(y=>document.getElementById('tb'+y).classList.toggle('on',y.toLowerCase()!==x?false:true));render()}
function init(){category.innerHTML=CATS.map(x=>`<option>${x}</option>`).join('');week.innerHTML=WEEKS.map(x=>`<option>${x}</option>`).join('');render()}
function render(){let total=expenses.reduce((a,e)=>a+e.dkk,0),budget=Object.values(catBudget).reduce((a,b)=>a+b,0);spentTotal.textContent=fmt(total);overallBudget.innerHTML=`mod budget <b>${fmt(budget)}</b> · rest ${fmt(budget-total)}`;recent.innerHTML=list(expenses.slice(-3).reverse());allExpenses.innerHTML=expenses.length?list(expenses.slice().reverse()):'<p class="meta">Ingen udgifter registreret endnu.</p>';weeks.innerHTML=WEEKS.map(w=>{let s=expenses.filter(e=>+e.week===w).reduce((a,e)=>a+e.dkk,0),b=budget/WEEKS.length,p=Math.min(100,s/b*100);return `<div class="expense week" onclick="openWeek(${w})"><b>Uge ${w}</b><div>${fmt(s)} mod budget ${fmt(b)}</div><div class="bar"><i style="width:${p}%"></i></div></div>`}).join('')}
function list(arr){return arr.map(e=>`<div class="expense"><b>${esc(e.category)} · ${e.currency==='EUR'?Number(e.amount).toLocaleString('da-DK')+' EUR':fmt(e.amount)}</b>${e.currency==='EUR'?` = ${fmt(e.dkk)}`:''}<div>${esc(e.note||'')}</div><div class="meta">Uge ${e.week}${e.city||e.country?' · '+esc([e.city,e.country].filter(Boolean).join(', ')):''}</div>${e.lat!=null?`<div><a class="maplink" target="_blank" href="https://www.openstreetmap.org/?mlat=${e.lat}&mlon=${e.lon}#map=16/${e.lat}/${e.lon}">📍 Se på kort</a></div>`:''}<button class="delete" onclick="deleteExpense('${e.id}')">🗑️ Slet udgift</button></div>`).join('')}
function deleteExpense(id){let e=expenses.find(x=>x.id===id);if(!e)return;if(confirm(`Er du sikker på, at du vil slette denne udgift?\n\n${e.category} · ${fmt(e.dkk)}\n\nHandlingen kan ikke fortrydes.`)){expenses=expenses.filter(x=>x.id!==id);persist();render()}}
function openAdd(){addModal.classList.remove('hidden');gps=null;gpsStatus.textContent=''} function closeAdd(){addModal.classList.add('hidden')}
async function getGPS(){gpsStatus.textContent='Henter position…';if(!navigator.geolocation){gpsStatus.textContent='GPS understøttes ikke.';return}navigator.geolocation.getCurrentPosition(async p=>{gps={lat:p.coords.latitude,lon:p.coords.longitude};gpsStatus.textContent='Position fundet. Finder by og land…';try{let r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${gps.lat}&lon=${gps.lon}&zoom=10&addressdetails=1`,{headers:{'Accept-Language':'da'}}),j=await r.json(),a=j.address||{};city.value=a.city||a.town||a.village||a.municipality||'';country.value=a.country||'';gpsStatus.textContent='✓ GPS, by og land fundet.'}catch(e){gpsStatus.textContent='✓ GPS fundet, men by/land kunne ikke hentes. Du kan skrive dem manuelt.'}},()=>gpsStatus.textContent='GPS kunne ikke hentes. Kontrollér tilladelse til lokalitet.',{enableHighAccuracy:true,timeout:12000})}
function saveExpense(){let a=parseFloat(amount.value);if(!a||a<=0){alert('Indtast et gyldigt beløb.');return}let cur=currency.value,dkk=cur==='EUR'?a*RATE:a;expenses.push({id:(crypto.randomUUID?crypto.randomUUID():Date.now().toString()),amount:a,currency:cur,dkk,category:category.value,week:+week.value,note:note.value,city:city.value,country:country.value,lat:gps?.lat??null,lon:gps?.lon??null,created:new Date().toISOString()});persist();amount.value='';note.value='';city.value='';country.value='';receipt.value='';closeAdd();render()}
function persist(){localStorage.setItem('summer2027_expenses',JSON.stringify(expenses))}
function openWeek(w){let wb=Object.values(catBudget).reduce((a,b)=>a+b,0)/WEEKS.length;weekTitle.textContent='Uge '+w;weekDetails.innerHTML=CATS.map(c=>{let s=expenses.filter(e=>+e.week===w&&e.category===c).reduce((a,e)=>a+e.dkk,0),b=catBudget[c]/WEEKS.length,p=b?s/b*100:0;return `<div class="expense"><b>${c}</b><div>Forbrug <b>${fmt(s)}</b> mod budget <b>${fmt(b)}</b> · ${Math.round(p)} %</div></div>`}).join('')+`<div class="expense"><b>Ugen i alt</b><div>${fmt(expenses.filter(e=>+e.week===w).reduce((a,e)=>a+e.dkk,0))} mod budget ${fmt(wb)}</div></div>`;weekModal.classList.remove('hidden')}
function closeWeek(){weekModal.classList.add('hidden')} function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
init();
</script></body></html>
